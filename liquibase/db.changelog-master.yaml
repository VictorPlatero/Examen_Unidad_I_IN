databaseChangeLog:
  - changeSet:
      id: 001-create-agroindustria-tables
      author: codex
      changes:
        - sqlFile:
            path: ../sql/01_create_tables.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 002-load-agroindustria-staging
      author: codex
      changes:
        - delete:
            schemaName: agroindustria
            tableName: stg_empresas_agroindustriales
        - loadData:
            file: ../data/agroindustria_nacional_2023_clean.csv
            relativeToChangelogFile: true
            separator: ";"
            quotchar: '"'
            encoding: UTF-8
            schemaName: agroindustria
            tableName: stg_empresas_agroindustriales
            usePreparedStatements: true
            columns:
              - column:
                  header: id_anonimo_emp
                  name: id_anonimo_emp
                  type: STRING
              - column:
                  header: anio
                  name: anio
                  type: NUMERIC
              - column:
                  header: ciiu
                  name: ciiu
                  type: STRING
              - column:
                  header: descciiu
                  name: descciiu
                  type: STRING
              - column:
                  header: sector
                  name: sector
                  type: STRING
              - column:
                  header: ubigeo
                  name: ubigeo
                  type: STRING
              - column:
                  header: departamento
                  name: departamento
                  type: STRING
              - column:
                  header: provincia
                  name: provincia
                  type: STRING
              - column:
                  header: distrito
                  name: distrito
                  type: STRING
              - column:
                  header: tamanio_emp
                  name: tamanio_emp
                  type: STRING
              - column:
                  header: valor_estimado_minimo_venta
                  name: valor_estimado_minimo_venta
                  type: NUMERIC
              - column:
                  header: valor_estimado_maximo_venta
                  name: valor_estimado_maximo_venta
                  type: NUMERIC
              - column:
                  header: exporta
                  name: exporta
                  type: STRING
              - column:
                  header: valor_estimado_minimo_fob_dolar
                  name: valor_estimado_minimo_fob_dolar
                  type: NUMERIC
              - column:
                  header: valor_estimado_maximo_fob_dolar
                  name: valor_estimado_maximo_fob_dolar
                  type: NUMERIC
              - column:
                  header: fec_creacion_raw
                  name: fec_creacion_raw
                  type: STRING

  - changeSet:
      id: 003-transform-agroindustria-model
      author: codex
      changes:
        - sqlFile:
            path: ../sql/02_transform_loaded_data.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
